services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE: cuda:0
      MODEL_DIR: /models
      YOLO_SIZE: ${YOLO_SIZE:-640}
      DEPTH_SIZE: ${DEPTH_SIZE:-518}
      CONFIDENCE: ${CONFIDENCE:-0.35}
      OBSTACLE_CONFIG: /workspace/config/settings.toml
      API_MAX_JPEG_BYTES: "5242880"
      API_MAX_PIXELS: "2073600"
    volumes:
      - ./models:/models
      - ./config:/workspace/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    stop_grace_period: 20s
